{% extends "anthology/base.html" %}

{% block content %}
<head>
  <!-- 🚫 Prevent browser caching and form resubmission -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    // 🧠 If user is already logged in (session active), redirect them to /reports
    // This prevents showing login page again when pressing Back
    {% if request.session.USER_ID %}
      window.location.replace("{% url 'anthology:reports' %}");
    {% endif %}
  </script>
</head>

<div class="container mt-5" style="max-width:420px;">
  <div class="card shadow-lg border-0">
    <div class="card-header bg-primary text-white text-center">
      <h5 class="mb-0">Anthology Dashboard Login</h5>
    </div>
    <div class="card-body p-4">
      <form method="post" autocomplete="off">
        {% csrf_token %}

        {% if messages %}
          {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
              {{ msg }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}

        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
