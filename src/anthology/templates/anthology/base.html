<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Anthology Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'anthology:reports' %}">Anthology</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="{% url 'anthology:reports' %}">Reports</a></li>
        <li class="nav-item position-relative">
  <a class="nav-link" href="{% url 'anthology:drafts' %}">
    Approvals
    {% if request.session.PENDING_DRAFT_COUNT and request.session.PENDING_DRAFT_COUNT > 0 %}
      <span class="badge bg-danger ms-1">{{ request.session.PENDING_DRAFT_COUNT }}</span>
    {% endif %}
  </a>
</li>

      </ul>
      <span class="navbar-text">
        Logged in as: {{ request.session.USER_DISPLAY_NAME|default:"Guest" }}
        <a href="{% url 'anthology:logout' %}" class="btn btn-link">Logout</a>
      </span>
    </div>
  </div>
</nav>

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>

</body>
</html>
