{% extends "anthology/base.html" %}
{% block content %}
<h3>Report {{ report.id }}</h3>
<p><strong>Study:</strong> {{ report.study_id }} &nbsp; <strong>Site:</strong> {{ report.site }}</p>

{% if blob_url %}
  <div style="height:800px">
    <iframe src="{{ blob_url }}" width="100%" height="100%"></iframe>
  </div>
{% else %}
  <div class="alert alert-warning">Document unavailable</div>
{% endif %}
{% endblock %}
